# /etc/nginx/sites-available/kindergarten-site
# Отдельный server-блок — не пересекается с системой управления на том же VPS.
# SSL: sudo certbot --nginx -d botakanym.edu.kz -d www.botakanym.edu.kz

upstream kgsite_app {
    server unix:/run/kindergarten-site/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name botakanym.edu.kz www.botakanym.edu.kz;

    client_max_body_size 25m;   # документы до 20 МБ

    # Безопасность. Внимание: add_header внутри location отменяет эти заголовки для него,
    # поэтому ниже кэш настраивается через expires, а не add_header.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Сборка React
    root /var/www/kindergarten-site/frontend/dist;
    index index.html;

    # Файлы с хешем в имени не меняются — кэшируем надолго
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Django: API, админка (путь админки = DJANGO_ADMIN_URL) и раздел оплат (только администратор)
    location = /payments { return 301 /payments/; }
    location ~ ^/(api|manage|payments)/ {
        proxy_pass http://kgsite_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /var/www/kindergarten-site/backend/staticfiles/;
        expires 1d;
    }

    # Загрузка разрешена только для pdf/doc/xls/изображений (проверяется в Django)
    location /media/ {
        alias /var/www/kindergarten-site/media/;
        expires 7d;
    }

    # index.html всегда проверяется заново — иначе после обновления сайта браузер возьмёт старую сборку
    location = /index.html {
        expires -1;
    }

    # Все остальные пути — React-роутер
    location / {
        try_files $uri /index.html;
    }
}
